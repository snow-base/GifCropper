<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="./coi-serviceworker.js"></script>
  <title>LoopFrame — Video to GIF</title>
  <meta name="description" content="브라우저에서 동영상을 고품질 GIF로 변환합니다." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0d0f;
      --surface: #14161a;
      --surface-2: #191c21;
      --field: #101216;
      --line: #292d34;
      --line-hover: #3a4049;
      --text: #f2f4f7;
      --muted: #9299a5;
      --accent: #7c9cff;
      --accent-hover: #8ba7ff;
      --success: #55c995;
      --warning: #e7b05c;
      --danger: #eb747b;
      --radius: 10px;
      --content: 1180px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .app-header {
      height: 58px;
      border-bottom: 1px solid var(--line);
      background: rgba(12,13,15,.96);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      width: min(var(--content), calc(100% - 28px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: #dce4ff;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 12px;
      margin-left: 2px;
      font-weight: 500;
    }

    .engine-badge,
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 9px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: #c5cbd4;
      font-size: 11px;
      white-space: nowrap;
    }

    .shell {
      width: min(var(--content), calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(330px, .7fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .panel-head {
      min-height: 50px;
      padding: 10px 12px 10px 15px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .panel-body { padding: 14px; }

    .btn,
    .btn-primary,
    .btn-danger,
    .icon-btn {
      border-radius: 8px;
      border: 1px solid var(--line);
      min-height: 36px;
      padding: 0 12px;
      font-weight: 650;
      transition: background .12s ease, border-color .12s ease, color .12s ease;
    }

    .btn,
    .icon-btn {
      background: var(--surface-2);
      color: #dce1e8;
    }

    .btn:hover:not(:disabled),
    .icon-btn:hover:not(:disabled) {
      background: #20242a;
      border-color: var(--line-hover);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #0c1020;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .btn-danger {
      display: none;
      background: #2a181b;
      border-color: #563137;
      color: #ffb5ba;
    }

    .btn-danger.active { display: inline-flex; align-items: center; justify-content: center; }

    button:disabled {
      cursor: not-allowed;
      opacity: .45;
    }

    .dropzone {
      position: relative;
      min-height: 500px;
      display: grid;
      place-items: center;
      border: 1px dashed #3a3f48;
      border-radius: 8px;
      background: #0e1013;
      overflow: hidden;
      transition: border-color .12s ease, background .12s ease;
    }

    .dropzone.drag {
      border-color: var(--accent);
      background: #111726;
    }

    .drop-empty {
      text-align: center;
      padding: 30px;
    }

    .drop-icon {
      width: 42px;
      height: 42px;
      margin: 0 auto 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: #cbd3df;
      font-size: 21px;
    }

    .drop-empty strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 700;
    }

    .drop-empty span {
      color: var(--muted);
      font-size: 12px;
    }

    .preview-wrap {
      width: 100%;
      height: 100%;
      display: none;
      place-items: center;
      background: #08090b;
    }

    .preview-wrap.active { display: grid; }

    video, .result-img {
      width: 100%;
      max-width: 100%;
      max-height: 620px;
      display: block;
      object-fit: contain;
      background: #08090b;
    }

    .file-strip {
      margin-top: 10px;
      display: none;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 10px;
      align-items: center;
      min-height: 42px;
      padding: 0 0 0 2px;
    }

    .file-strip.active { display: grid; }

    .file-bullet { display: none; }

    .file-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #dfe3e9;
      font-size: 12px;
      font-weight: 600;
    }

    .file-meta {
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .icon-btn {
      min-height: 30px;
      padding: 0 9px;
      font-size: 11px;
    }

    .privacy { display: none; }

    .settings {
      display: grid;
      gap: 0;
    }

    .group {
      padding: 14px 15px;
      border-bottom: 1px solid var(--line);
    }

    .group:last-of-type { border-bottom: 0; }

    .group-head {
      margin-bottom: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .group-title {
      margin: 0;
      color: #f1f3f6;
      font-size: 12px;
      font-weight: 720;
    }

    .group-sub { display: none; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .row + .row,
    .field + .field { margin-top: 9px; }

    .field {
      display: grid;
      gap: 6px;
      min-width: 0;
    }

    .field > span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 550;
    }

    input[type="number"],
    select {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      color: #e9edf2;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      outline: none;
    }

    input[type="number"]:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124,156,255,.14);
    }

    .row .btn {
      min-height: 34px;
      padding: 0 9px;
      font-size: 11px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: #c4cad2;
      font-size: 11px;
      user-select: none;
    }

    .check input { accent-color: var(--accent); }

    .quality-note { display: none; }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 14px 15px 15px;
      border-top: 1px solid var(--line);
      background: #121418;
    }

    .actions .btn-primary,
    .actions .btn-danger { min-height: 42px; }

    .progress-box {
      display: none;
      margin: 0 15px 14px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101216;
    }

    .progress-box.active { display: block; }

    .progress-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      color: #cfd4dc;
      font-size: 11px;
    }

    .bar {
      height: 5px;
      border-radius: 999px;
      background: #242830;
      overflow: hidden;
    }

    .bar > div {
      width: 0;
      height: 100%;
      background: var(--accent);
      transition: width .18s linear;
    }

    .bar.indeterminate > div {
      width: 30%;
      animation: progress-sweep 1.5s ease-in-out infinite alternate;
    }

    @keyframes progress-sweep {
      from { transform: translateX(0); }
      to { transform: translateX(233%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar.indeterminate > div { animation: none; }
    }

    .status {
      margin-top: 7px;
      min-height: 15px;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      min-height: 0;
      margin: -4px 15px 14px;
      color: #7e8692;
      font-size: 10px;
      line-height: 1.45;
    }

    .hint:empty { display: none; }
    .warn { color: var(--warning); }
    .error { color: var(--danger); }

    .result {
      margin-top: 14px;
      display: none;
    }

    .result.active { display: block; }

    .result-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      gap: 14px;
    }

    .result-side {
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .stat {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111317;
    }

    .stat small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 10px;
    }

    .stat strong {
      display: block;
      font-size: 12px;
      line-height: 1.4;
    }

    .download {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      color: #08150f;
      background: var(--success);
    }

    @media (max-width: 900px) {
      .workspace, .result-grid { grid-template-columns: 1fr; }
      .dropzone { min-height: 360px; }
      .brand-sub { display: none; }
    }

    @media (max-width: 560px) {
      .header-inner, .shell { width: min(100% - 18px, var(--content)); }
      .shell { padding-top: 10px; }
      .workspace { gap: 10px; }
      .row { grid-template-columns: 1fr; }
      .dropzone { min-height: 300px; }
      .file-strip { grid-template-columns: minmax(0,1fr) auto; }
      .file-meta { grid-column: 1; }
      .icon-btn { grid-column: 2; grid-row: 1 / span 2; }
      .result-grid { gap: 10px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M7 5.5h10a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 17 18.5H7A2.5 2.5 0 0 1 4.5 16V8A2.5 2.5 0 0 1 7 5.5Z" stroke="currentColor" stroke-width="1.7"/>
            <path d="M10 9.2 15 12l-5 2.8V9.2Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-name">LoopFrame <span class="brand-sub">Video → GIF</span></div>
      </div>
      <span id="engineBadge" class="engine-badge">엔진 대기</span>
    </div>
  </header>

  <main class="shell">
    <section class="workspace">
      <article class="panel">
        <div class="panel-head">
          <h2>영상</h2>
          <button id="pickBtn" class="btn" type="button">파일 선택</button>
        </div>
        <div class="panel-body">
          <div id="dropzone" class="dropzone">
            <div id="dropEmpty" class="drop-empty">
              <div class="drop-icon">＋</div>
              <strong>동영상을 선택하거나 끌어놓기</strong>
              <span>MP4 · WebM · MOV · MKV · AVI</span>
            </div>
            <div id="previewWrap" class="preview-wrap">
              <video id="video" controls playsinline></video>
            </div>
          </div>

          <input id="fileInput" type="file" accept="video/*,.mkv,.mov,.avi,.m4v" hidden />

          <div id="fileStrip" class="file-strip">
            <div class="file-bullet" aria-hidden="true"></div>
            <div class="file-name" id="fileName">-</div>
            <div class="file-meta" id="fileMeta">-</div>
            <button id="removeBtn" class="icon-btn" type="button">제거</button>
          </div>

          <div class="privacy"><b>로컬 처리</b><span>영상은 외부 서버로 업로드되지 않습니다.</span></div>
        </div>
      </article>

      <aside class="panel">
        <div class="panel-head">
          <h2>설정</h2>
        </div>

        <div class="settings">
          <section class="group">
            <div class="group-head">
              <h3 class="group-title">구간</h3>
            </div>
            <div class="row">
              <label class="field"><span>시작 (초)</span><input id="startTime" type="number" min="0" step="0.01" value="0" /></label>
              <label class="field"><span>종료 (초)</span><input id="endTime" type="number" min="0" step="0.01" value="5" /></label>
            </div>
            <div class="row">
              <button id="setStartBtn" class="btn" type="button">현재 위치 → 시작</button>
              <button id="setEndBtn" class="btn" type="button">현재 위치 → 종료</button>
            </div>
          </section>

          <section class="group">
            <div class="group-head">
              <h3 class="group-title">출력</h3>
            </div>
            <div class="row">
              <label class="field"><span>최대 너비</span><input id="width" type="number" min="64" max="1920" step="2" value="720" /></label>
              <label class="field"><span>FPS</span>
                <select id="fps">
                  <option value="10">10</option>
                  <option value="12">12</option>
                  <option value="15" selected>15</option>
                  <option value="20">20</option>
                  <option value="24">24</option>
                  <option value="30">30</option>
                </select>
              </label>
            </div>
            <label class="check"><input id="noUpscale" type="checkbox" checked /> 원본보다 크게 확대하지 않기</label>
          </section>

          <section class="group">
            <div class="group-head">
              <h3 class="group-title">색상</h3>
            </div>
            <label class="field"><span>팔레트</span>
              <select id="paletteMode">
                <option value="global" selected>전체 영상</option>
                <option value="motion">움직임 우선</option>
                <option value="frame">프레임별</option>
              </select>
            </label>
            <div class="row">
              <label class="field"><span>색상 수</span>
                <select id="colors">
                  <option value="128">128</option>
                  <option value="192">192</option>
                  <option value="256" selected>256</option>
                </select>
              </label>
              <label class="field"><span>디더링</span>
                <select id="dither">
                  <option value="sierra2_4a" selected>Sierra2 4A</option>
                  <option value="floyd_steinberg">Floyd–Steinberg</option>
                  <option value="bayer">Bayer</option>
                  <option value="none">없음</option>
                </select>
              </label>
            </div>
            <div id="qualityNote" class="quality-note"></div>
          </section>

          <div class="actions">
            <button id="convertBtn" class="btn-primary" type="button" disabled>GIF 변환</button>
            <button id="cancelBtn" class="btn-danger" type="button">취소</button>
          </div>

          <div id="progressBox" class="progress-box">
            <div class="progress-line"><span id="progressLabel">준비 중</span><span id="progressPct">0%</span></div>
            <div class="bar"><div id="progressBar"></div></div>
            <div id="status" class="status"></div>
          </div>

          <div id="runtimeHint" class="hint"></div>
        </div>
      </aside>
    </section>

    <section id="result" class="panel result">
      <div class="panel-head">
        <h2>결과</h2>
        <span id="resultMode" class="badge">GIF</span>
      </div>
      <div class="panel-body result-grid">
        <div class="preview-wrap active"><img id="resultImg" class="result-img" alt="변환된 GIF 미리보기" /></div>
        <div class="result-side">
          <div class="stat"><small>파일 크기</small><strong id="resultSize">-</strong></div>
          <div class="stat"><small>출력</small><strong id="resultSpec">-</strong></div>
          <div class="stat"><small>구간</small><strong id="resultDuration">-</strong></div>
          <a id="downloadBtn" class="download" download="loopframe.gif">GIF 다운로드</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    const FFMPEG_VERSION = '0.12.15';
    const UTIL_VERSION = '0.12.2';
    const CORE_VERSION = '0.12.10';

    const $ = (id) => document.getElementById(id);
    const els = {
      pickBtn: $('pickBtn'), fileInput: $('fileInput'), dropzone: $('dropzone'), dropEmpty: $('dropEmpty'),
      previewWrap: $('previewWrap'), video: $('video'), fileStrip: $('fileStrip'), fileName: $('fileName'),
      fileMeta: $('fileMeta'), removeBtn: $('removeBtn'), startTime: $('startTime'), endTime: $('endTime'),
      setStartBtn: $('setStartBtn'), setEndBtn: $('setEndBtn'), width: $('width'), fps: $('fps'), noUpscale: $('noUpscale'),
      paletteMode: $('paletteMode'), colors: $('colors'), dither: $('dither'), qualityNote: $('qualityNote'),
      convertBtn: $('convertBtn'), cancelBtn: $('cancelBtn'), progressBox: $('progressBox'), progressLabel: $('progressLabel'),
      progressPct: $('progressPct'), progressBar: $('progressBar'), status: $('status'), engineBadge: $('engineBadge'),
      result: $('result'), resultImg: $('resultImg'), resultSize: $('resultSize'), resultSpec: $('resultSpec'),
      resultDuration: $('resultDuration'), downloadBtn: $('downloadBtn'), resultMode: $('resultMode'), runtimeHint: $('runtimeHint')
    };

    let inputFile = null;
    let inputURL = null;
    let resultURL = null;
    let ffmpeg = null;
    let FFmpegClass = null;
    let fetchFile = null;
    let classWorkerURL = null;
    let engineLoad = null;
    const coreURLs = [];
    let conversionController = null;
    let converting = false;
    let expectedDuration = 1;
    let encodingStart = null;
    let lastEngineLog = '';

    const fmtBytes = (n) => {
      if (!Number.isFinite(n)) return '-';
      const u = ['B','KB','MB','GB']; let i = 0; let v = n;
      while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
      return `${v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)} ${u[i]}`;
    };
    const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
    const setProgress = (p, label, status) => {
      const pct = clamp(Number.isFinite(p) ? p : 0, 0, 1);
      els.progressBox.classList.add('active');
      const indeterminate = p === null;
      els.progressBar.parentElement.classList.toggle('indeterminate', indeterminate);
      els.progressBar.style.width = indeterminate ? '' : `${(pct * 100).toFixed(1)}%`;
      els.progressPct.textContent = indeterminate ? '—' : `${Math.round(pct * 100)}%`;
      if (label) els.progressLabel.textContent = label;
      if (status) els.status.textContent = status;
    };
    const setBusy = (busy) => {
      converting = busy;
      els.convertBtn.disabled = busy || !inputFile;
      els.cancelBtn.classList.toggle('active', busy);
      els.pickBtn.disabled = busy;
      els.removeBtn.disabled = busy;
    };

    function updateQualityNote() {
      const mode = els.paletteMode.value;
      const notes = {
        global: '선택한 구간 전체를 분석해 하나의 팔레트를 만듭니다. 색이 안정적이고 장면 간 깜빡임이 적어 일반 영상에 가장 무난합니다.',
        motion: '이전 프레임과 달라진 영역에 더 큰 비중을 줍니다. 배경은 고정되고 피사체만 움직이는 영상에서 팔레트 낭비를 줄이기 좋습니다.',
        frame: '각 프레임마다 새 팔레트를 만듭니다. 작은 대비색과 순간적으로 등장하는 색을 가장 잘 보존하지만 GIF 용량이 크게 늘 수 있습니다.'
      };
      els.qualityNote.textContent = notes[mode];
    }
    els.paletteMode.addEventListener('change', updateQualityNote);

    async function loadModules(signal) {
      if (FFmpegClass) return;
      els.engineBadge.textContent = '모듈 로드 중';
      const [{ FFmpeg }, util] = await Promise.all([
        import(`https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/esm/index.js`),
        import(`https://cdn.jsdelivr.net/npm/@ffmpeg/util@${UTIL_VERSION}/dist/esm/index.js`)
      ]);
      signal.throwIfAborted();
      FFmpegClass = FFmpeg;
      fetchFile = util.fetchFile;

      const workerBootstrap = `import "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@${FFMPEG_VERSION}/dist/esm/worker.js";`;
      classWorkerURL = URL.createObjectURL(new Blob([workerBootstrap], { type: 'text/javascript' }));
    }

    function resetEngine() {
      engineLoad?.controller.abort();
      engineLoad = null;
      ffmpeg?.terminate();
      ffmpeg = null;
      for (const url of coreURLs) URL.revokeObjectURL(url);
      coreURLs.length = 0;
    }

    function initEngine() {
      if (engineLoad) return engineLoad.promise;
      if (ffmpeg?.loaded) return Promise.resolve(ffmpeg);

      const controller = new AbortController();
      const promise = loadEngine(controller.signal).catch((err) => {
        controller.signal.throwIfAborted();
        resetEngine();
        console.error(err);
        els.engineBadge.textContent = '엔진 로드 실패';
        els.status.textContent = String(err?.message || err);
        throw err;
      }).finally(() => {
        if (engineLoad?.controller === controller) engineLoad = null;
      });
      engineLoad = { controller, promise };
      return promise;
    }

    async function fetchCoreURL(url, type, signal) {
      const response = await fetch(url, { signal });
      if (!response.ok) throw new Error(`FFmpeg 파일을 받지 못했습니다: ${url.split('/').pop()} (HTTP ${response.status})`);
      const bytes = await response.arrayBuffer();
      signal.throwIfAborted();
      const objectURL = URL.createObjectURL(new Blob([bytes], { type }));
      coreURLs.push(objectURL);
      return objectURL;
    }

    async function loadEngine(signal) {
      await loadModules(signal);
      signal.throwIfAborted();
      const engine = new FFmpegClass();
      ffmpeg = engine;

      engine.on('log', ({ message }) => {
        if (converting && message?.trim()) lastEngineLog = message.trim();
      });
      engine.on('progress', ({ time }) => {
        if (!converting || encodingStart === null || !Number.isFinite(time)) return;
        const fraction = clamp(time / 1_000_000 / expectedDuration, 0, 1);
        setProgress(encodingStart + fraction * (.98 - encodingStart));
      });

      const canMT = crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined';
      const corePkg = canMT ? '@ffmpeg/core-mt' : '@ffmpeg/core';
      const coreBase = `https://cdn.jsdelivr.net/npm/${corePkg}@${CORE_VERSION}/dist/esm`;
      els.engineBadge.textContent = canMT ? '멀티코어 준비 중' : '엔진 로드 중';
      setProgress(.03, '엔진 로드 중', canMT ? '멀티코어 FFmpeg를 준비합니다.' : 'FFmpeg WebAssembly를 준비합니다.');

      const config = {
        classWorkerURL,
        coreURL: await fetchCoreURL(`${coreBase}/ffmpeg-core.js`, 'text/javascript', signal),
        wasmURL: await fetchCoreURL(`${coreBase}/ffmpeg-core.wasm`, 'application/wasm', signal)
      };
      if (canMT) config.workerURL = await fetchCoreURL(`${coreBase}/ffmpeg-core.worker.js`, 'text/javascript', signal);

      signal.throwIfAborted();
      await engine.load(config);
      signal.throwIfAborted();
      els.engineBadge.textContent = canMT ? '멀티코어 사용 중' : '싱글코어 사용 중';
      const cores = Math.max(1, navigator.hardwareConcurrency || 1);
      els.runtimeHint.textContent = canMT
        ? `멀티코어 FFmpeg가 활성화되었습니다. 브라우저가 ${cores}개의 논리 CPU를 보고합니다. 실제 사용 코어 수는 작업에 따라 달라질 수 있습니다.`
        : '싱글스레드 FFmpeg로 동작 중입니다. GitHub Pages에서는 coi-serviceworker.js가 같은 폴더에 있고 HTTPS로 접속했는지 확인하세요.';
      return engine;
    }

    function setFile(file) {
      if (!file || converting) return;
      if (!file.type.startsWith('video/') && !/\.(mkv|mov|avi|m4v|mp4|webm)$/i.test(file.name)) {
        alert('동영상 파일을 선택해 주세요.');
        return;
      }
      inputFile = file;
      if (inputURL) URL.revokeObjectURL(inputURL);
      inputURL = URL.createObjectURL(file);
      els.video.src = inputURL;
      els.dropEmpty.style.display = 'none';
      els.previewWrap.classList.add('active');
      els.fileStrip.classList.add('active');
      els.fileName.textContent = file.name;
      els.fileMeta.textContent = fmtBytes(file.size);
      els.convertBtn.disabled = false;
      els.result.classList.remove('active');
      els.video.load();
      els.video.onloadedmetadata = () => {
        const d = Number.isFinite(els.video.duration) ? els.video.duration : 0;
        els.startTime.value = '0';
        els.endTime.value = d ? Math.min(d, 8).toFixed(2) : '5';
        els.startTime.max = d || '';
        els.endTime.max = d || '';
        els.fileMeta.textContent = `${fmtBytes(file.size)}${d ? ` · ${d.toFixed(2)}초 · ${els.video.videoWidth}×${els.video.videoHeight}` : ''}`;
        if (d > 30) els.runtimeHint.innerHTML = '<span class="warn">긴 영상입니다.</span> GIF는 짧은 구간으로 만들수록 속도와 결과가 좋습니다. 5~12초 정도부터 테스트해 보세요.';
      };
      initEngine().catch(() => {});
    }

    function clearFile() {
      if (converting) return;
      inputFile = null;
      if (inputURL) URL.revokeObjectURL(inputURL);
      inputURL = null;
      els.video.removeAttribute('src');
      els.video.load();
      els.dropEmpty.style.display = '';
      els.previewWrap.classList.remove('active');
      els.fileStrip.classList.remove('active');
      els.convertBtn.disabled = true;
      els.result.classList.remove('active');
    }

    els.pickBtn.addEventListener('click', () => els.fileInput.click());
    els.fileInput.addEventListener('change', (e) => { setFile(e.target.files?.[0]); e.target.value = ''; });
    els.removeBtn.addEventListener('click', clearFile);
    ['dragenter','dragover'].forEach((ev) => els.dropzone.addEventListener(ev, (e) => { e.preventDefault(); els.dropzone.classList.add('drag'); }));
    ['dragleave','drop'].forEach((ev) => els.dropzone.addEventListener(ev, (e) => { e.preventDefault(); els.dropzone.classList.remove('drag'); }));
    els.dropzone.addEventListener('drop', (e) => setFile(e.dataTransfer?.files?.[0]));
    els.dropzone.addEventListener('dblclick', () => { if (!converting) els.fileInput.click(); });
    els.setStartBtn.addEventListener('click', () => { if (inputFile) els.startTime.value = els.video.currentTime.toFixed(2); });
    els.setEndBtn.addEventListener('click', () => { if (inputFile) els.endTime.value = els.video.currentTime.toFixed(2); });

    function buildFilters() {
      const fps = clamp(parseInt(els.fps.value, 10) || 15, 1, 60);
      const width = clamp(parseInt(els.width.value, 10) || 720, 64, 1920);
      const colors = clamp(parseInt(els.colors.value, 10) || 256, 2, 256);
      const mode = els.paletteMode.value;
      const stats = mode === 'motion' ? 'diff' : mode === 'frame' ? 'single' : 'full';
      const paletteNew = mode === 'frame' ? ':new=1' : ':new=0';
      const scale = els.noUpscale.checked
        ? `scale=w='min(iw,${width})':h=-2:flags=lanczos`
        : `scale=w=${width}:h=-2:flags=lanczos`;
      const dither = els.dither.value;
      const ditherExtra = dither === 'bayer' ? ':bayer_scale=3' : '';
      const diffMode = mode === 'frame' ? '' : ':diff_mode=rectangle';
      return {
        video: `fps=${fps},${scale}`,
        palette: `palettegen=max_colors=${colors}:reserve_transparent=0:stats_mode=${stats}`,
        apply: `paletteuse=dither=${dither}${ditherExtra}${diffMode}${paletteNew}`,
        perFrame: mode === 'frame',
        resultSpec: `${width}px 최대 · ${fps} FPS · ${colors}색`,
        resultMode: els.paletteMode.options[els.paletteMode.selectedIndex].text.split('—')[0].trim()
      };
    }

    async function safeDelete(engine, path) {
      try { await engine.deleteFile(path); } catch (_) {}
    }

    async function runFFmpeg(engine, args, signal) {
      lastEngineLog = '';
      const code = await engine.exec(args);
      signal.throwIfAborted();
      if (code !== 0) {
        const detail = lastEngineLog ? ` — ${lastEngineLog}` : '';
        throw new Error(`${els.progressLabel.textContent} 실패 (FFmpeg 종료 코드 ${code})${detail}`);
      }
    }

    async function convert() {
      if (!inputFile || converting) return;
      const start = Math.max(0, parseFloat(els.startTime.value) || 0);
      const endRaw = parseFloat(els.endTime.value);
      const videoDuration = Number.isFinite(els.video.duration) ? els.video.duration : Infinity;
      const end = Math.min(Number.isFinite(endRaw) ? endRaw : start + 5, videoDuration);
      if (!(end > start)) { alert('종료 시간은 시작 시간보다 커야 합니다.'); return; }
      expectedDuration = end - start;
      if (expectedDuration > 30 && !confirm('30초가 넘는 GIF는 브라우저 메모리와 파일 크기가 매우 커질 수 있습니다. 계속할까요?')) return;

      conversionController = new AbortController();
      const { signal } = conversionController;
      encodingStart = null;
      setBusy(true);
      els.result.classList.remove('active');
      setProgress(.01, '준비 중', 'FFmpeg 엔진을 확인합니다.');

      const inputExt = (inputFile.name.match(/\.([a-z0-9]+)$/i)?.[1] || 'mp4').toLowerCase();
      const inputName = `input_${Date.now()}.${inputExt}`;
      const outputName = `output_${Date.now()}.gif`;
      const filters = buildFilters();
      const paletteName = filters.perFrame ? null : `palette_${Date.now()}.png`;

      let engine;
      try {
        engine = await initEngine();
        signal.throwIfAborted();
        setProgress(.06, '영상 로드 중', `${fmtBytes(inputFile.size)} 파일을 WebAssembly 파일 시스템으로 복사합니다.`);
        const inputBytes = await fetchFile(inputFile);
        signal.throwIfAborted();
        await engine.writeFile(inputName, inputBytes);
        signal.throwIfAborted();

        const duration = expectedDuration.toFixed(3);
        // Limit the input before palettegen so it reaches EOF at the selected end time.
        const clipInput = ['-ss', start.toFixed(3), '-t', duration, '-i', inputName];
        const args = [...clipInput];
        let graph;
        if (paletteName) {
          setProgress(null, '팔레트 분석 중', `선택한 ${expectedDuration.toFixed(2)}초 구간의 색상을 분석합니다.`);
          await runFFmpeg(engine, [
            ...clipInput, '-an', '-vf', `${filters.video},${filters.palette}`,
            '-frames:v', '1', '-update', '1', paletteName
          ], signal);
          args.push('-i', paletteName);
          graph = `[0:v]${filters.video}[v];[v][1:v]${filters.apply}`;
          encodingStart = .35;
        } else {
          graph = `[0:v]${filters.video},split[v][colors];[colors]${filters.palette}[p];[v][p]${filters.apply}`;
          encodingStart = .10;
        }
        setProgress(encodingStart, 'GIF 인코딩 중', '팔레트와 디더링을 적용합니다.');
        await runFFmpeg(engine, [
          ...args, '-t', duration, '-an', '-filter_complex', graph, '-loop', '0', outputName
        ], signal);
        encodingStart = null;

        setProgress(.99, '결과 읽는 중', '완성된 GIF를 브라우저로 가져옵니다.');
        const data = await engine.readFile(outputName);
        signal.throwIfAborted();
        const bytes = data instanceof Uint8Array ? data : new Uint8Array(data);
        const blob = new Blob([bytes.buffer], { type: 'image/gif' });
        if (resultURL) URL.revokeObjectURL(resultURL);
        resultURL = URL.createObjectURL(blob);

        els.resultImg.src = resultURL;
        els.downloadBtn.href = resultURL;
        els.downloadBtn.download = `${inputFile.name.replace(/\.[^.]+$/, '') || 'loopframe'}.gif`;
        els.resultSize.textContent = fmtBytes(blob.size);
        els.resultSpec.textContent = filters.resultSpec;
        els.resultDuration.textContent = `${expectedDuration.toFixed(2)}초 (${start.toFixed(2)}–${end.toFixed(2)})`;
        els.resultMode.textContent = filters.resultMode;
        els.result.classList.add('active');
        setProgress(1, '완료', 'GIF 변환이 완료되었습니다.');
        els.result.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        if (signal.aborted) return;
        console.error(err);
        const msg = String(err?.message || err);
        setProgress(0, '변환 실패', msg);
        if (/worker|module|cors|fetch/i.test(msg)) {
          els.runtimeHint.innerHTML = '<span class="warn">실행 환경 제한일 수 있습니다.</span> GitHub Pages, localhost, 또는 Live Server처럼 HTTP/HTTPS 환경에서 열어 보세요.';
        }
      } finally {
        if (engine && !signal.aborted) {
          await safeDelete(engine, inputName);
          await safeDelete(engine, outputName);
          if (paletteName) await safeDelete(engine, paletteName);
        }
        if (!signal.aborted) {
          conversionController = null;
          setBusy(false);
        }
      }
    }

    els.convertBtn.addEventListener('click', convert);
    els.cancelBtn.addEventListener('click', () => {
      if (!conversionController) return;
      conversionController.abort();
      conversionController = null;
      resetEngine();
      setBusy(false);
      setProgress(0, '취소됨', '변환을 취소했습니다. 다음 변환 때 엔진을 다시 로드합니다.');
      els.engineBadge.textContent = '엔진 재시작 필요';
    });

    window.addEventListener('beforeunload', () => {
      if (inputURL) URL.revokeObjectURL(inputURL);
      if (resultURL) URL.revokeObjectURL(resultURL);
      if (classWorkerURL) URL.revokeObjectURL(classWorkerURL);
    });

    updateQualityNote();

    if (location.protocol === 'file:') {
      els.runtimeHint.innerHTML = '<span class="warn">file://에서는 Service Worker와 멀티코어 FFmpeg를 사용할 수 없습니다.</span> GitHub Pages(HTTPS) 또는 localhost에서 실행하세요.';
    } else if (window.crossOriginIsolated && typeof SharedArrayBuffer !== 'undefined') {
      const cores = Math.max(1, navigator.hardwareConcurrency || 1);
      els.engineBadge.textContent = '멀티코어 가능';
      els.runtimeHint.textContent = `cross-origin isolation 활성화 · SharedArrayBuffer 사용 가능 · 논리 CPU ${cores}개 감지. 변환 시 멀티코어 FFmpeg를 로드합니다.`;
    } else if (location.hostname.endsWith('github.io')) {
      els.runtimeHint.textContent = 'GitHub Pages 격리 준비 중입니다. 첫 방문에는 Service Worker 등록 때문에 페이지가 한 번 자동 새로고침될 수 있습니다.';
    }
  </script>
</body>
</html>
